# /etc/nginx/sites-available/portal
# Replace YOUR_DOMAIN below, then:
#   ln -s /etc/nginx/sites-available/portal /etc/nginx/sites-enabled/portal
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
# Run certbot afterwards; it rewrites this file to add the TLS block and
# the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Django/WhiteNoise serves /static/ itself, but nginx is faster at it.
    location /static/ {
        alias /srv/portal/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # settings.py reads this to decide request.is_secure()
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    client_max_body_size 10M;
}
