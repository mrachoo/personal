{% comment %}Bottom tab-bar item for mobile. Expects: url_name, label, icon{% endcomment %}
<a href="{% url url_name %}"
   class="flex flex-1 flex-col items-center justify-center gap-1 py-2 transition-colors {% if request.resolver_match.url_name == url_name %}text-blue-950{% else %}text-gray-400{% endif %}">
    <svg class="h-[22px] w-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="{% if request.resolver_match.url_name == url_name %}2.2{% else %}1.8{% endif %}" stroke-linecap="round" stroke-linejoin="round">
        {% if icon == "home" %}
            <path d="M3 11l9-7 9 7"/>
            <path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/>
        {% elif icon == "bank" %}
            <path d="M3 10l9-6 9 6"/>
            <path d="M4 10v9M20 10v9M9 10v9M15 10v9"/>
            <path d="M3 19h18"/>
        {% elif icon == "list" %}
            <rect x="5" y="3" width="14" height="18" rx="1"/>
            <path d="M8 8h8M8 12h8M8 16h5"/>
        {% elif icon == "swap" %}
            <path d="M4 7h13l-3-3M20 17H7l3 3"/>
        {% elif icon == "card" %}
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M7 15h4"/>
        {% endif %}
    </svg>
    <span class="text-[10px] font-medium leading-none">{{ label }}</span>
</a>
