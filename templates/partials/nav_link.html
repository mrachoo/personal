{% comment %}Expects: url_name, label, icon{% endcomment %}
<a href="{% url url_name %}"
   class="group flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-[13.5px] font-medium transition-colors {% if request.resolver_match.url_name == url_name %}bg-white text-blue-950 shadow-sm{% else %}text-blue-100/70 hover:bg-white/10 hover:text-white{% endif %}">
    <svg class="w-[18px] h-[18px] shrink-0 {% if request.resolver_match.url_name == url_name %}text-blue-950{% else %}text-blue-200/50 group-hover:text-white{% endif %} transition-colors"
         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        {% if icon == "home" %}
            <path d="M3 11l9-7 9 7"/>
            <path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/>
        {% elif icon == "user" %}
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M4.5 20a7.5 7.5 0 0115 0"/>
        {% elif icon == "bank" %}
            <path d="M3 10l9-6 9 6"/>
            <path d="M4 10v9M20 10v9M9 10v9M15 10v9"/>
            <path d="M3 19h18"/>
        {% elif icon == "list" %}
            <rect x="5" y="3" width="14" height="18" rx="1"/>
            <path d="M8 8h8M8 12h8M8 16h5"/>
        {% elif icon == "chat" %}
            <path d="M4 5h16v11H8l-4 4V5z"/>
        {% elif icon == "swap" %}
            <path d="M4 7h13l-3-3M20 17H7l3 3"/>
        {% elif icon == "deposit" %}
            <path d="M12 4v10m0 0l-3.5-3.5M12 14l3.5-3.5"/>
            <path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>
        {% elif icon == "card" %}
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M7 15h4"/>
        {% endif %}
    </svg>
    <span class="flex-1">{{ label }}</span>
    {% if badge %}
    <span class="ml-auto flex h-5 min-w-[20px] items-center justify-center rounded-full bg-red-500 px-1.5 text-[11px] font-bold leading-none text-white">{{ badge }}</span>
    {% endif %}
</a>
