{% comment %}Nav item for the mobile slide-up sheet. Same icons as nav_link.html but
coloured for a light background. Expects: url_name, label, icon{% endcomment %}
<a href="{% url url_name %}"
   class="flex items-center gap-3.5 rounded-xl px-3.5 py-3 text-[15px] font-medium transition-colors {% if request.resolver_match.url_name == url_name %}bg-blue-50 text-blue-950{% else %}text-gray-800 active:bg-gray-100{% endif %}">
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg {% if request.resolver_match.url_name == url_name %}bg-blue-100 text-blue-950{% else %}bg-gray-100 text-gray-600{% endif %}">
        <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            {% if icon == "user" %}
                <circle cx="12" cy="8" r="3.5"/>
                <path d="M4.5 20a7.5 7.5 0 0115 0"/>
            {% elif icon == "bank" %}
                <path d="M3 10l9-6 9 6"/>
                <path d="M4 10v9M20 10v9M9 10v9M15 10v9"/>
                <path d="M3 19h18"/>
            {% elif icon == "chat" %}
                <path d="M4 5h16v11H8l-4 4V5z"/>
            {% elif icon == "deposit" %}
                <path d="M12 4v10m0 0l-3.5-3.5M12 14l3.5-3.5"/>
                <path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>
            {% elif icon == "list" %}
                <rect x="5" y="3" width="14" height="18" rx="1"/>
                <path d="M8 8h8M8 12h8M8 16h5"/>
            {% endif %}
        </svg>
    </span>
    <span class="flex-1">{{ label }}</span>
    <svg class="h-4 w-4 shrink-0 text-gray-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6l6 6-6 6"/>
    </svg>
</a>
