{% comment %}Expects: sr (ServiceRequest){% endcomment %}
<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-medium ring-1 ring-inset
             {% if sr.status == 'pending' %}bg-amber-50 text-amber-700 ring-amber-600/15
             {% elif sr.status == 'approved' %}bg-emerald-50 text-emerald-700 ring-emerald-600/10
             {% else %}bg-red-50 text-red-700 ring-red-600/10{% endif %}">
    <span class="h-1.5 w-1.5 rounded-full
                 {% if sr.status == 'pending' %}bg-amber-500
                 {% elif sr.status == 'approved' %}bg-emerald-500
                 {% else %}bg-red-500{% endif %}"></span>
    {% if sr.status == 'pending' %}Pending approval{% elif sr.status == 'approved' %}Approved{% else %}Declined{% endif %}
</span>
