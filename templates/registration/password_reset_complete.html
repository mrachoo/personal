{% extends "base.html" %}
{% block title %}Password updated - Member Portal{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-2xl p-8 text-center shadow-2xl shadow-blue-950/40">
    <span class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-50 text-emerald-600">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>
        </svg>
    </span>
    <h1 class="text-xl font-bold tracking-tight text-gray-900 mb-2">Password updated</h1>
    <p class="text-sm text-gray-500 mb-6">You can now log in with your new password.</p>
    <a href="{% url 'login' %}"
       class="inline-block rounded-xl bg-gradient-to-br from-[#0B1626] to-[#16294D] px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:opacity-90">
        Go to login
    </a>
</div>
{% endblock %}
