{% extends "base.html" %}
{% block title %}Check your email - Member Portal{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-2xl p-8 text-center shadow-2xl shadow-blue-950/40">
    <span class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-blue-50 text-blue-800">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
        </svg>
    </span>
    <h1 class="text-xl font-bold tracking-tight text-gray-900 mb-2">Check your email</h1>
    <p class="text-sm leading-relaxed text-gray-500">
        If an account exists with that email, a password reset link is on its way.
    </p>
</div>
{% endblock %}
