{% extends "base.html" %}
{% block title %}Log in - Member Portal{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-2xl p-8 shadow-2xl shadow-blue-950/40">
    <h1 class="text-xl font-bold tracking-tight text-gray-900 mb-1">Welcome back</h1>
    <p class="text-sm text-gray-500 mb-6">Log in to your portal.</p>

    {% if form.non_field_errors %}
        <div class="mb-5 flex items-start gap-2.5 rounded-xl border border-red-100 bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
            <svg class="mt-0.5 h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
            </svg>
            {{ form.non_field_errors.0 }}
        </div>
    {% endif %}

    <form method="post" class="space-y-5">
        {% csrf_token %}
        <div>
            <label for="{{ form.username.id_for_label }}" class="block text-[13px] font-semibold text-gray-700">Email</label>
            <input type="email" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" autofocus required placeholder="you@example.com"
                   class="mt-1.5 block w-full rounded-xl border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm transition focus:outline-none focus:ring-4 focus:ring-blue-900/10 focus:border-blue-900">
        </div>
        <div>
            <div class="flex items-center justify-between">
                <label for="{{ form.password.id_for_label }}" class="block text-[13px] font-semibold text-gray-700">Password</label>
                <a href="{% url 'password_reset' %}" class="text-xs font-medium text-blue-800 transition hover:text-blue-950">Forgot password?</a>
            </div>
            <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" required placeholder="••••••••"
                   class="mt-1.5 block w-full rounded-xl border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm transition focus:outline-none focus:ring-4 focus:ring-blue-900/10 focus:border-blue-900">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit"
                class="w-full rounded-xl bg-gradient-to-br from-[#0B1626] to-[#16294D] py-2.5 text-sm font-semibold text-white shadow-sm transition hover:opacity-90">
            Log in
        </button>
    </form>
</div>
{% endblock %}
